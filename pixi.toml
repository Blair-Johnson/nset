[workspace]
name = "not-shitty-experiment-tracker"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tasks]
web-install = "npm --prefix web ci"
web-build = "npm --prefix web run build"
web-test = "npm --prefix web test"
build = { cmd = "cargo build --release --locked", depends-on = ["web-build"] }
check = { cmd = "cargo test --locked", depends-on = ["web-build", "web-test"] }
serve = { cmd = "cargo run -- --data-dir ./data", depends-on = ["web-build"] }
demo = "python examples/demo.py"
server-debug = { cmd = "cargo build --locked", depends-on = ["web-build"] }
api-test = { cmd = "python -m unittest discover -s tests -p 'test_*.py'", depends-on = ["server-debug"] }
browser-install = "npm --prefix web exec -- playwright install chromium"
browser-test = { cmd = "python scripts/browser_verify.py", depends-on = ["build"], env = { NSET_BINARY = "target/release/nset" } }
format-check = "cargo fmt --all -- --check"
verify = { depends-on = ["check", "api-test", "format-check"] }
preview = { cmd = "python scripts/preview.py", depends-on = ["build"] }
benchmark = { cmd = "python scripts/benchmark.py", depends-on = ["build"], env = { NSET_BINARY = "target/release/nset" } }

[dependencies]
rust = ">=1.85,<2"
nodejs = ">=22.12,<23"
python = ">=3.12,<3.14"

[feature.compat.pypi-dependencies]
mlflow-skinny = ">=3, <4"
wandb = ">=0.20, <1"
tensorboard = ">=2, <3"
pillow = "*"

[environments]
compat = ["compat"]
